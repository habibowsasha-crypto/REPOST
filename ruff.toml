target-version = "py312"
line-length = 120

[lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = [
    # Domain mixins intentionally share the compatibility namespaces exported
    # by handler_shared.py and db_shared.py.
    "F403",
    "F405",
]

[lint.per-file-ignores]
"laika_bot/db_shared.py" = ["F401"]
"laika_bot/handler_shared.py" = ["F401"]
